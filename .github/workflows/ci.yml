name: CI

on:
  push:
    branches: [develop, next]
  pull_request:
    branches: [develop, next]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
        - "3.10"
        - "3.11"
        - "3.12"
        - "3.13"
        - "3.14"
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install poetry
      uses: snok/install-poetry@v1
      with:
        version: latest
    - name: Run tests
      run: |
        poetry install --no-interaction --with dev --all-extras
        poetry run python scripts/build.py lint
        poetry run python scripts/build.py pytest --coverage

  packaging:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install poetry
      uses: snok/install-poetry@v1
      with:
        version: latest
    - name: Build the wheel
      run: poetry build
    - name: Verify every extra publishes its requirements
      run: python scripts/check_packaging.py

  docs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install poetry
      uses: snok/install-poetry@v1
      with:
        version: latest
    - name: Install dependencies
      run: poetry install --no-interaction --with dev --all-extras
    - name: Build documentation
      run: poetry run mkdocs build --strict
    - name: Upload docs artifact
      uses: actions/upload-artifact@v4
      with:
        name: documentation
        path: site/
