site_name: hier-config-ai
site_description: AI-powered network configuration remediation with GPT/LLM integration
site_url: https://hier-config-ai.readthedocs.io/
repo_url: https://github.com/netdevops/hier-config-ai
repo_name: netdevops/hier-config-ai
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - content.code.copy
    - content.code.annotate

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
      - Installation: installation.md
      - Quick Start: quickstart.md
  - User Guide:
      - Models and Agents: user-guide/models.md
      - Validation and Guardrails: user-guide/validation.md
      - Prompt Templates: user-guide/prompt-templates.md
      - Advanced Features: user-guide/advanced-features.md
  - Examples: examples.md
  - API Reference: api-reference.md
  - Contributing: contributing.md
  - Changelog: changelog.md
