[tool.poetry]
name = "hier-config-ai"
version = "0.2.1a0"
description = "Hierarchical network configuration remediation driven by LLMs, built on hier-config and PydanticAI."
authors = ["James Williams <james.williams@packetgeek.net>"]
license = "Apache-2.0"
readme = "README.md"
homepage = "https://github.com/netdevops/hier-config-ai"
repository = "https://github.com/netdevops/hier-config-ai"
documentation = "https://hier-config-ai.readthedocs.io/"
keywords = ["network", "configuration", "automation", "llm", "ai", "cisco", "networking", "pydantic-ai"]
packages = [{include = "hier_config_ai"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Networking",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
pydantic = ">=2.12,<3.0"
hier-config = {version = ">=4.0.0b1,<5.0", allow-prereleases = true}
pydantic-ai-slim = ">=2.33.0,<3.0"

# Optional provider SDKs. These MUST be declared here with `optional = true`
# for `[tool.poetry.extras]` to publish them as wheel metadata. Declaring them
# in optional *groups* instead silently produces extras with no requirements.
# Constraints mirror the matching `pydantic-ai-slim` extra.
openai = {version = ">=3.0.0", optional = true}
tiktoken = {version = ">=0.12.0", optional = true}
anthropic = {version = ">=1.0.0", optional = true}
google-genai = {version = ">=2.18.0", optional = true}
boto3 = {version = ">=1.42.63", optional = true}
groq = {version = ">=0.25.0", optional = true}
mistralai = {version = ">=2.9.2", optional = true}

[tool.poetry.extras]
# Ollama, Azure OpenAI, and OpenRouter all speak the OpenAI-compatible API,
# so they are served by the `openai` extra.
openai = ["openai", "tiktoken"]
ollama = ["openai", "tiktoken"]
anthropic = ["anthropic"]
google = ["google-genai"]
bedrock = ["boto3"]
groq = ["groq"]
mistral = ["mistralai"]
all = ["openai", "tiktoken", "anthropic", "google-genai", "boto3", "groq", "mistralai"]

[tool.poetry.group.dev.dependencies]
flynt = "*"
mkdocs = "^1.6.1"
mkdocs-material = "^9.5.0"
mypy = "*"
pylint = "*"
pylint-pydantic = "*"
pyright = "*"
pytest = "*"
pytest-asyncio = "*"
pytest-cov = "*"
pytest-xdist = "*"
ruff = "*"
typer = "*"
yamllint = "*"

[tool.poetry.group.evals]
optional = true

[tool.poetry.group.evals.dependencies]
pydantic-evals = ">=2.33.0,<3.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


[tool.pyright]
typeCheckingMode = "strict"


[tool.pylint.message_control]
load-plugins = [
    "pylint.extensions.bad_builtin",
    "pylint.extensions.broad_try_clause",
    "pylint.extensions.check_elif",
    "pylint.extensions.comparison_placement",
    "pylint.extensions.confusing_elif",
    "pylint.extensions.consider_ternary_expression",
    "pylint.extensions.dict_init_mutate",
    "pylint.extensions.dunder",
    "pylint.extensions.eq_without_hash",
    "pylint.extensions.for_any_all",
    "pylint.extensions.overlapping_exceptions",
    "pylint.extensions.redefined_loop_name",
    "pylint.extensions.set_membership",
    "pylint.extensions.typing",
    "pylint_pydantic",
]
disable = [
    "consider-alternative-union-syntax",
    "cyclic-import",  # Only lazy (function-level) cycles remain
    "duplicate-code",  # Enable this at some point in the future
    "fixme",  # Covered by ruff FIX002
    "import-outside-toplevel", # Covered by ruff PLC0415
    "line-too-long",  # Whatever ruff format determines the line should look like is fine
    "missing-function-docstring",
    "missing-module-docstring",
    "protected-access",  # Covered by ruff SLF001
    "redefined-loop-name",  # Covered by ruff PLW2901
    "too-many-arguments",  # Covered by ruff PLR0913
    "too-many-return-statements",  # Covered by ruff PLR0911
    "too-many-locals",  # Covered by ruff PLR0914
    "too-many-public-methods",  # Covered by ruff PLR0904
]


[tool.mypy]
strict = true
pretty = true
show_column_numbers = true
show_error_codes = true
show_error_context = true
warn_unreachable = true
plugins = [
    "pydantic.mypy"
]


[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["ALL"]
preview = true
ignore = [
    # The below checks we might never enable
    "B019",  # using lru_cache can cause memory leaks
    "COM812",  # DO NOT REMOVE: conflicts with ruff formater
    "CPY001", # Missing copyright notice at top of file
    "D213",  # DO NOT REMOVE: multi-line-summary-second-line is incompatible with D212(multi-line-summary-first-line)
    "E501",  # line too long
    "EXE002",  # DO NOT REMOVE: The file is executable but no shebang is present
    "ISC001",  # DO NOT REMOVE: The following rule may cause conflicts when used with the formatter
    "PLR2004",  # Magic value used in comparison
    # The below checks should eventually be enabled
    "D100",  # Missing docstring in public module
    "D102",  # Missing docstring in public method
    "D103",  # Missing docstring in public function
    "D104",  # Missing docstring in public package
    "D105",  # Missing docstring in magic method
    "D107",  # Missing docstring in `__init__`
    "D200",  # One-line docstring should fit on one line
    "D203",  # 1 blank line required before class docstring - Incompatible with D211
    "D205",  # 1 blank line required between summary line and description
    "D401",  # First line of docstring should be in imperative mood
    "DOC201",  # `return` is not documented in docstring
    "DOC402",  # `yield` is not documented in docstring
    "DOC501",  # Raised exception missing from docstring
]

[tool.ruff.lint.flake8-pytest-style]
parametrize-values-type = "tuple"

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["PLC2701", "S101"]
# Development scripts are command-line tools; printing is their output.
"scripts/*" = ["T201"]
# Evaluator.evaluate overrides a base method, so it must stay an instance
# method even where it does not touch self.
"evals/*" = ["PLR6301", "T201"]
# Examples are scripts meant to be read and run; printing is the point.
"examples/*" = ["T201"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers --strict-config"
